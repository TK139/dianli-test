version: "3.9"

services:
  neo4j:
    image: neo4j:5.25.1
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/power123
    volumes:
      - neo4j_data:/data
    # ✅ 5.x 支持 wget 健康检查，比 cypher-shell 更轻量
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    build: .
    command: python init_data.py
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: power123
      INIT_FORCE: "true"
    depends_on:
      neo4j:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8501:8501"
#    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: power123
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./llm_config.yaml:/app/llm_config.yaml

volumes:
  neo4j_data:
